# ============================================================
# Shore — 本地开发 / 测试环境 docker compose
# 全栈：frontend(next.js) + api(fastapi) + postgres(pgvector) + redis
# Prometheus / ES 复用现有基础设施，不在此 compose 中
# ============================================================

name: shore

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shore-postgres
    environment:
      POSTGRES_USER: bestnative
      POSTGRES_PASSWORD: bestnative
      POSTGRES_DB: bestnative
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestnative"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shore-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shore-api
    env_file:
      - ./backend/.env
      - ./backend/.env.secrets
    environment:
      DATABASE_URL: postgresql+asyncpg://bestnative:bestnative@postgres:5432/bestnative
      DATABASE_URL_SYNC: postgresql+psycopg2://bestnative:bestnative@postgres:5432/bestnative
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend/config/environments.json:/app/config/environments.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 建表 + 启动 API（K8s 凭证仅在设置页粘贴入库，不挂载本地 kubeconfig）
    command: ["/app/entrypoint.sh"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_ENV: development
    container_name: shore-frontend
    environment:
      NEXT_PUBLIC_ENV: development
      INTERNAL_API_URL: http://api:8000
    ports:
      - "3456:3456"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
    external: true
    name: bestnative_pgdata
